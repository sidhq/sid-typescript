name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-build
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-package
          path: .artifacts/*.tgz
          include-hidden-files: true
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: sdk-package
          path: .artifacts
      - name: Test installed ESM, CommonJS, WASM, and declarations
        shell: bash
        run: node scripts/smoke-package.mjs .artifacts/*.tgz
