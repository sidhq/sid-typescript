[package]
name = "sid-snippet-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
alyze = "=0.1.5"
wasm-bindgen = "=0.2.100"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
